site_name: Sostenibilitat aplicada al sistema productiu
site_description: Materials publicables del mòdul 1708 per a CFGS DAW
site_author: Sostenibilitat DAW
site_url: https://fermasdo.github.io/Apunts_Sostenibilitat/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: ca
  font: false
  features:
    - navigation.sections
    - navigation.top
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 2-4

extra_css:
  - assets/estils-publicacio.css

nav:
  - Portada: index.md
  - Guia del mòdul: guia-modul.md
  - Unitats:
      - U01 · La sostenibilitat en les organitzacions: unitats/u01.md
      - U02 · Reptes ambientals i socials: unitats/u02.md
      - U03 · Els ODS en l'acompliment professional i personal: unitats/u03.md
      - U04 · Economia verda i circular: unitats/u04.md
      - U05 · Activitats sostenibles i medi ambient: unitats/u05.md
      - U06 · El pla de sostenibilitat: unitats/u06.md
  - Informació del curs:
      - Itinerari i càrrega orientativa: curs/itinerari.md
      - Pla i planificació del curs: curs/pla-curs.md
      - Matriu curricular: curs/matriu-curricular.md
      - Estat de publicació: curs/estat-publicacio.md
