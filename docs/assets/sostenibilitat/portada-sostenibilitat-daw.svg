<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Sostenibilitat aplicada al sistema productiu — DAW</title>
  <desc id="desc">Portada abstracta: una retícula de sistemes digitals connectats amb quatre punts de decisió. Els textos indiquen persones, recursos, decisions i evidència.</desc>
  <metadata>Autoria: equip de disseny del projecte. Llicència: CC0 1.0. Recurs original; sense fonts externes. Creat: 2026-07-31.</metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#294052" stroke-width="1" opacity=".28"/></pattern>
    <style>text{font-family:Arial,Helvetica,sans-serif}.kicker{font-size:24px;letter-spacing:3px;font-weight:bold}.title{font-size:66px;font-weight:bold}.sub{font-size:27px}.tag{font-size:19px;font-weight:bold;letter-spacing:1px}.small{font-size:18px}.line{fill:none;stroke:#E7B75F;stroke-width:5;stroke-linecap:round}.node{fill:#142B3D;stroke:#E7B75F;stroke-width:5}.square{fill:#177E89}.ring{fill:none;stroke:#D46A4C;stroke-width:5}</style>
  </defs>
  <rect width="1600" height="720" fill="#F7F4EE"/><rect width="1600" height="720" fill="url(#grid)"/>
  <rect x="90" y="80" width="12" height="540" fill="#D46A4C"/>
  <text x="140" y="145" class="kicker" fill="#177E89">CFGS DAW · MÒDUL 1708</text>
  <text x="140" y="245" class="title" fill="#142B3D">Sostenibilitat aplicada</text>
  <text x="140" y="320" class="title" fill="#142B3D">al sistema productiu</text>
  <text x="143" y="375" class="sub" fill="#294052">Pensar el servei web com un sistema:</text><text x="143" y="412" class="sub" fill="#294052">decidir, comprovar, explicar els límits.</text>
  <path class="line" d="M820 200H1050L1180 300H1420"/><path class="line" d="M820 510H1010L1150 400H1420"/>
  <circle class="node" cx="820" cy="200" r="48"/><rect class="square" x="1020" y="170" width="60" height="60" rx="10"/><circle class="ring" cx="1180" cy="300" r="52"/><path class="node" d="M1400 270h40v60h-40z"/>
  <circle class="node" cx="820" cy="510" r="48"/><rect class="square" x="980" y="480" width="60" height="60" rx="10"/><circle class="ring" cx="1150" cy="400" r="52"/><path class="node" d="M1400 370h40v60h-40z"/>
  <text x="760" y="280" class="tag" fill="#142B3D">PERSONES</text><text x="994" y="270" class="tag" fill="#142B3D">RECURSOS</text><text x="1120" y="380" class="tag" fill="#142B3D">DECISIONS</text><text x="1350" y="470" class="tag" fill="#142B3D">EVIDÈNCIA</text>
  <text x="140" y="575" class="small" fill="#294052">Material per a aprenentatge autònom i semipresencial · 2026–2027</text>
  <text x="140" y="610" class="small" fill="#294052">Cap afirmació essencial depén només del color.</text>
</svg>
