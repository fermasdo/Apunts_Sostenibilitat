<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1320" role="img" aria-labelledby="title desc">
  <title id="title">Cicle de vida d'un servici web</title>
  <desc id="desc">Bucle vertical de set fases numerades: concepció, disseny, desenrotllament, infraestructura i desplegament, transferència i ús, manteniment i retirada. Una fletxa torna de retirada a concepció. Una nota indica que la comparació conserva funció, frontera i dades pendents visibles.</desc>
  <metadata>Autoria: equip de disseny del projecte. Llicència: CC0 1.0. Recurs original; sense fonts externes. Creat: 2026-07-31. Revisat: 2026-08-04. Instrucció: representar exactament les set fases textuals d'U04 en un bucle vertical, sense quantificar una ACV.</metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563EB"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}.h{font-size:34px;font-weight:700}.k{font-size:26px;font-weight:700}.s{font-size:24px}.box{fill:#FFF;stroke:#334155;stroke-width:3}.arr{fill:none;stroke:#2563EB;stroke-width:5}.tip{fill:#2563EB}.note{fill:#0F172A}.light{fill:#FFFFFF;font-size:24px;font-weight:700}</style>
  <rect width="640" height="1320" fill="#F8FAFC"/><text class="h" x="32" y="55">Cicle de vida d'un servici web</text>
  <path class="arr" d="M320 180v32M320 315v32M320 450v32M320 585v32M320 720v32M320 855v32"/><path class="tip" d="M310 200h20l-10 14zM310 335h20l-10 14zM310 470h20l-10 14zM310 605h20l-10 14zM310 740h20l-10 14zM310 875h20l-10 14z"/>
  <g><rect class="box" x="70" y="95" width="500" height="85" rx="12"/><text class="k" x="95" y="130">1 · Concepció</text><text class="s" x="95" y="160">Necessitat, persones i alternatives.</text></g>
  <g><rect class="box" x="70" y="230" width="500" height="85" rx="12"/><text class="k" x="95" y="265">2 · Disseny</text><text class="s" x="95" y="295">Funció, UX, accessibilitat, dades i frontera.</text></g>
  <g><rect class="box" x="70" y="365" width="500" height="85" rx="12"/><text class="k" x="95" y="400">3 · Desenrotllament</text><text class="s" x="95" y="430">Codi, dependències, proves i entorns.</text></g>
  <g><rect class="box" x="70" y="500" width="500" height="85" rx="12"/><text class="k" x="95" y="535">4 · Infraestructura i desplegament</text><text class="s" x="95" y="565">Servidors, xarxes, còpies i servicis auxiliars.</text></g>
  <g><rect class="box" x="70" y="635" width="500" height="85" rx="12"/><text class="k" x="95" y="670">5 · Transferència i ús</text><text class="s" x="95" y="700">Recursos, interaccions, dispositiu i tasca.</text></g>
  <g><rect class="box" x="70" y="770" width="500" height="85" rx="12"/><text class="k" x="95" y="805">6 · Manteniment</text><text class="s" x="95" y="835">Suport, actualització i compatibilitat.</text></g>
  <g><rect class="box" x="70" y="905" width="500" height="105" rx="12"/><text class="k" x="95" y="940">7 · Retirada</text><text class="s" x="95" y="970">Dades, desprovisionament, reutilització</text><text class="s" x="95" y="998">i RAEE quan siga aplicable.</text></g>
  <path class="arr" d="M70 958H25V138h45"/><path class="tip" d="M68 128v20l15-10z"/><rect class="note" x="55" y="1080" width="530" height="180" rx="14"/><text class="light" fill="#FFFFFF" x="85" y="1125">Per a interpretar el bucle:</text><text class="light" fill="#FFFFFF" x="85" y="1165">· mateixa funció</text><text class="light" fill="#FFFFFF" x="85" y="1205">· frontera declarada</text><text class="light" fill="#FFFFFF" x="85" y="1245">· dades pendents visibles</text>
</svg>
