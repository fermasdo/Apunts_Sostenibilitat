<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 930" role="img" aria-labelledby="title desc">
  <title id="title">Auditoria: separar indicadors intermedis i impactes</title>
  <desc id="desc">Una base comuna de funció, frontera, unitat, línia base i mètode es dividix en dos recorreguts. El recorregut A registra inventari i indicadors intermedis. El recorregut B avalua categories d'impacte amb dades, absències, mètode, incertesa i conclusió delimitada. Una regla final indica que un proxy no equival a un impacte ambiental final.</desc>
  <metadata>Autoria: equip de disseny del projecte. Llicència: CC0 1.0. Recurs original; sense fonts externes. Creat: 2026-07-31. Revisat: 2026-08-04. Instrucció: separar visualment els dos recorreguts exigits en U05 sense afegir categories ni valors.</metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563EB"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}.h{font-size:34px;font-weight:700}.k{font-size:26px;font-weight:700}.s{font-size:24px}.core{fill:#0F172A}.light{fill:#FFFFFF;font-size:24px;font-weight:700}.box{fill:#FFF;stroke:#334155;stroke-width:3}.arr{fill:none;stroke:#2563EB;stroke-width:5}.tip{fill:#2563EB}.note{fill:#DBEAFE;stroke:#2563EB;stroke-width:3}</style>
  <rect width="640" height="930" fill="#F8FAFC"/><text class="h" x="32" y="55">Auditoria: dos recorreguts</text>
  <rect class="core" x="40" y="95" width="560" height="135" rx="14"/><text class="light" fill="#FFFFFF" x="70" y="135">Base comuna</text><text class="light" fill="#FFFFFF" x="70" y="170">Funció · unitat · frontera · línia base</text><text class="light" fill="#FFFFFF" x="70" y="202">mateix mètode i condicions</text>
  <path class="arr" d="M320 230v55"/><path class="tip" d="M310 273h20l-10 14z"/>
  <g><rect class="box" x="40" y="305" width="560" height="180" rx="12"/><text class="k" x="70" y="345">A · Inventari i indicadors intermedis</text><text class="s" x="70" y="385">Peticions, transferència, temps, consultes</text><text class="s" x="70" y="418">o execucions, amb procedència.</text><text class="s" x="70" y="455">Resultat: canvi del procés dins del límit.</text></g>
  <path class="arr" d="M320 485v55"/><path class="tip" d="M310 528h20l-10 14z"/>
  <g><rect class="box" x="40" y="560" width="560" height="205" rx="12"/><text class="k" x="70" y="600">B · Avaluació d'impactes</text><text class="s" x="70" y="640">Categories considerades · dades i absències</text><text class="s" x="70" y="673">mètode · incertesa · conclusió delimitada.</text><text class="s" x="70" y="713">Pot ser qualitativa quan falten dades.</text><text class="s" x="70" y="745">No amaga allò que no es pot calcular.</text></g>
  <rect class="note" x="40" y="815" width="560" height="80" rx="12"/><text class="k" x="65" y="850">Regla de lectura</text><text class="s" x="65" y="880">Un proxy no equival a un impacte ambiental final.</text>
</svg>
