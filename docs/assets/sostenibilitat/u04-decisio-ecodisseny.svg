<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
  <title id="title">Registre d'una decisió d'ecodisseny</title>
  <desc id="desc">Seqüència numerada de cinc targetes: problema, decisió, criteri, prova i límit. Una nota final indica que la comparació ha de conservar la mateixa funció, declarar la frontera i separar millora tècnica d'impacte final.</desc>
  <metadata>Autoria: equip de disseny del projecte. Llicència: CC0 1.0. Recurs original; sense fonts externes. Creat: 2026-07-31. Revisat: 2026-08-04. Instrucció: fer llegible en mòbil el registre textual d'U04, amb seqüència inequívoca i sense afirmar beneficis.</metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563EB"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}.h{font-size:34px;font-weight:700}.k{font-size:26px;font-weight:700}.s{font-size:24px}.box{fill:#FFF;stroke:#334155;stroke-width:3}.arr{stroke:#2563EB;stroke-width:5}.tip{fill:#2563EB}.note{fill:#DBEAFE;stroke:#2563EB;stroke-width:3}</style>
  <rect width="640" height="1010" fill="#F8FAFC"/><text class="h" x="32" y="55">Registre d'una decisió d'ecodisseny</text>
  <path class="arr" d="M320 190v35M320 335v35M320 480v35M320 625v35"/><path class="tip" d="M310 213h20l-10 14zM310 358h20l-10 14zM310 503h20l-10 14zM310 648h20l-10 14z"/>
  <g><rect class="box" x="45" y="95" width="550" height="95" rx="12"/><text class="k" x="70" y="133">1 · Problema</text><text class="s" x="70" y="166">Què ocorre en la línia base?</text></g>
  <g><rect class="box" x="45" y="240" width="550" height="95" rx="12"/><text class="k" x="70" y="278">2 · Decisió</text><text class="s" x="70" y="311">Què es conserva, simplifica, modifica o retira?</text></g>
  <g><rect class="box" x="45" y="385" width="550" height="95" rx="12"/><text class="k" x="70" y="423">3 · Criteri</text><text class="s" x="70" y="456">Quin principi orienta el canvi?</text></g>
  <g><rect class="box" x="45" y="530" width="550" height="95" rx="12"/><text class="k" x="70" y="568">4 · Prova</text><text class="s" x="70" y="601">Com es revisa amb la mateixa tasca?</text></g>
  <g><rect class="box" x="45" y="675" width="550" height="95" rx="12"/><text class="k" x="70" y="713">5 · Límit</text><text class="s" x="70" y="746">Què no prova o quin risc pot introduir?</text></g>
  <rect class="note" x="45" y="825" width="550" height="145" rx="12"/><text class="k" x="70" y="865">Comparació responsable</text><text class="s" x="70" y="900">Mateixa funció · frontera declarada.</text><text class="s" x="70" y="930">Mateix mètode.</text><text class="s" x="70" y="960">Una millora tècnica no prova un impacte final.</text>
</svg>
