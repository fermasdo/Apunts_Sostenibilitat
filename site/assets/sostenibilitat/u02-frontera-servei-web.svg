<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
  <title id="title">Frontera d'anàlisi d'un servici web</title>
  <desc id="desc">Cadena vertical de cinc passos: necessitat de la persona, dispositiu i navegador, xarxa i transferència, servici web i API, i resposta. Un contorn discontinu marca una frontera que s'ha de declarar. Tres targetes demanen unitat funcional, estat de les dades i exclusions.</desc>
  <metadata>Autoria: equip de disseny del projecte. Llicència: CC0 1.0. Recurs original; sense fonts externes. Creat: 2026-07-31. Revisat: 2026-08-04. Instrucció: representar la cadena textual d'U02 sense fixar una arquitectura universal ni inventar dades.</metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563EB"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}.h{font-size:34px;font-weight:700}.k{font-size:26px;font-weight:700}.s{font-size:24px}.box{fill:#FFF;stroke:#334155;stroke-width:3}.frame{fill:none;stroke:#334155;stroke-width:3;stroke-dasharray:10 8}.arr{stroke:#2563EB;stroke-width:5}.tip{fill:#2563EB}.note{fill:#DBEAFE;stroke:#2563EB;stroke-width:3}</style>
  <rect width="640" height="1120" fill="#F8FAFC"/><text class="h" x="32" y="55">Frontera d'anàlisi del servici</text>
  <rect class="frame" x="25" y="80" width="590" height="690" rx="16"/><text class="s" x="50" y="115">FRONTERA: declara què inclous i què exclous</text>
  <path class="arr" d="M320 220v35M320 355v35M320 490v35M320 625v35"/><path class="tip" d="M310 243h20l-10 14zM310 378h20l-10 14zM310 513h20l-10 14zM310 648h20l-10 14z"/>
  <g><rect class="box" x="80" y="135" width="480" height="85" rx="12"/><text class="k" x="105" y="170">1 · Necessitat de la persona</text><text class="s" x="105" y="200">Acció que es vol completar.</text></g>
  <g><rect class="box" x="80" y="270" width="480" height="85" rx="12"/><text class="k" x="105" y="305">2 · Dispositiu i navegador</text><text class="s" x="105" y="335">Component inclòs o exclusió declarada.</text></g>
  <g><rect class="box" x="80" y="405" width="480" height="85" rx="12"/><text class="k" x="105" y="440">3 · Xarxa i transferència</text><text class="s" x="105" y="470">Dades disponibles o absents.</text></g>
  <g><rect class="box" x="80" y="540" width="480" height="85" rx="12"/><text class="k" x="105" y="575">4 · Servici web i API</text><text class="s" x="105" y="605">No representa una arquitectura universal.</text></g>
  <g><rect class="box" x="80" y="675" width="480" height="70" rx="12"/><text class="k" x="105" y="719">5 · Resposta</text></g>
  <g><rect class="note" x="40" y="810" width="560" height="80" rx="12"/><text class="k" x="65" y="845">Unitat funcional</text><text class="s" x="65" y="874">Quina tasca comparable presta el servici?</text></g>
  <g><rect class="note" x="40" y="910" width="560" height="80" rx="12"/><text class="k" x="65" y="945">Estat de les dades</text><text class="s" x="65" y="974">Mesurades, estimades, hipotètiques o absents.</text></g>
  <g><rect class="note" x="40" y="1010" width="560" height="80" rx="12"/><text class="k" x="65" y="1045">Exclusions</text><text class="s" x="65" y="1074">Què queda fora i com limita la conclusió?</text></g>
</svg>
