<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1110" role="img" aria-labelledby="title desc">
  <title id="title">De la decisió DAW a una acció ODS verificable</title>
  <desc id="desc">Seqüència numerada de cinc passos: decisió DAW, repte afectació i meta, acció delimitada, comprovació amb línia base i evidència, i límits. Dos blocs finals diferencien un risc d'una oportunitat condicionada.</desc>
  <metadata>Autoria: equip de disseny del projecte. Llicència: CC0 1.0. Recurs original; sense fonts externes. Creat: 2026-07-31. Revisat: 2026-08-04. Instrucció: sintetitzar U03 en una cadena vertical; la meta ha d'estar justificada i no s'han d'inventar resultats.</metadata>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563EB"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}.h{font-size:34px;font-weight:700}.k{font-size:26px;font-weight:700}.s{font-size:24px}.box{fill:#FFF;stroke:#334155;stroke-width:3}.arr{stroke:#2563EB;stroke-width:5}.tip{fill:#2563EB}.note{fill:#DBEAFE;stroke:#2563EB;stroke-width:3}.limit{fill:#F8FAFC;stroke:#334155;stroke-width:3;stroke-dasharray:9 7}</style>
  <rect width="640" height="1110" fill="#F8FAFC"/><text class="h" x="32" y="55">De la decisió a l'acció verificable</text>
  <path class="arr" d="M320 190v35M320 335v35M320 480v35M320 625v35"/><path class="tip" d="M310 213h20l-10 14zM310 358h20l-10 14zM310 503h20l-10 14zM310 648h20l-10 14z"/>
  <g><rect class="box" x="45" y="95" width="550" height="95" rx="12"/><text class="k" x="70" y="133">1 · Decisió DAW</text><text class="s" x="70" y="166">Tasca o pràctica concreta que es revisa.</text></g>
  <g><rect class="box" x="45" y="240" width="550" height="95" rx="12"/><text class="k" x="70" y="278">2 · Repte, afectació i meta</text><text class="s" x="70" y="311">Nexe justificat; no sols un número o una icona.</text></g>
  <g><rect class="box" x="45" y="385" width="550" height="95" rx="12"/><text class="k" x="70" y="423">3 · Acció delimitada</text><text class="s" x="70" y="456">Canvi, àmbit, període i capacitat d'intervenció.</text></g>
  <g><rect class="box" x="45" y="530" width="550" height="95" rx="12"/><text class="k" x="70" y="568">4 · Comprovació</text><text class="s" x="70" y="601">Línia base, criteri d'èxit i evidència.</text></g>
  <g><rect class="limit" x="45" y="675" width="550" height="110" rx="12"/><text class="k" x="70" y="713">5 · Límits</text><text class="s" x="70" y="746">Dades absents, compensacions i efecte rebot.</text></g>
  <g><rect class="box" x="45" y="835" width="550" height="95" rx="12"/><text class="k" x="70" y="873">Risc</text><text class="s" x="70" y="906">Efecte advers possible; no és un resultat segur.</text></g>
  <g><rect class="note" x="45" y="955" width="550" height="120" rx="12"/><text class="k" x="70" y="993">Oportunitat condicionada</text><text class="s" x="70" y="1026">Millora possible si es complixen les condicions</text><text class="s" x="70" y="1055">i es conserva evidència.</text></g>
</svg>
